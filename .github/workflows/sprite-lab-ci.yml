name: RiverStorm Sprite Lab CI
on:
  push:
    branches: [graphics-phaser-sprites]
  workflow_dispatch:
jobs:
  sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check sprite TypeScript
        run: npm run check:sprites
      - name: Build both game and sprite preview
        run: npm run build
      - name: Verify output
        run: |
          test -s dist/index.html
          test -s dist/phaser-preview.html
          test -s dist/build-info.json
