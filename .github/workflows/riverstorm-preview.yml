name: RiverStorm - Testes e Web Preview
on:
  push:
    branches: [full-game-graphics-integration]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: riverstorm-pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Prepare browser build for Pages
        run: |
          mkdir -p public-preview
          cp -r dist/. public-preview/
          test -f public-preview/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: riverstorm-web-test
          path: public-preview/
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: riverstorm-web-test
          path: ./public-preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-preview
      - id: deployment
        uses: actions/deploy-pages@v4
