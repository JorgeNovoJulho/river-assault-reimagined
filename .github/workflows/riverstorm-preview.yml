name: RiverStorm - Testes e Web Preview
on:
  push:
    branches: [full-game-graphics-integration]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: riverstorm-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run zero-dependency regression suite
        run: node --test tests/*.test.cjs
      - name: Install dependencies for Vite build
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify runtime versions and project paths
        run: |
          node --version
          npm --version
          test -f index.html
          test -f vite.config.js
          test -d tests
      - name: Confirm npm test script
        run: npm test
      - name: Build web game
        run: npm run build -- --base=./
      - name: Prepare browser build for Pages
        run: |
          mkdir -p public-preview
          cp -r dist/. public-preview/
          test -f public-preview/index.html
      - name: Verify deployed bundle
        run: |
          test -s public-preview/index.html
          test -s public-preview/build-info.json
          node -e "const fs=require('fs'); const html=fs.readFileSync('public-preview/index.html','utf8'); if(!html.includes('riverstorm-build'))process.exit(1); console.log('Versioned game bundle confirmed')"
      - uses: actions/upload-artifact@v4
        with:
          name: riverstorm-web-test
          path: public-preview/
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: riverstorm-web-test
          path: ./public-preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-preview
      - id: deployment
        uses: actions/deploy-pages@v4
