name: RiverStorm Premium - build isolado e auditoria

on:
  push:
    branches: [riverstorm-premium-nucleo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  premium-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar mestres exatos das margens da Missão 02
        run: |
          set -euo pipefail
          base='assets/sprites/premium/approved/environment/mission_02_industrial'
          cat .github/mission2-payload/bank_left.png.b64.* | base64 --decode > "$base/bank_left.png"
          cat .github/mission2-payload/bank_right.png.b64.* | base64 --decode > "$base/bank_right.png"
          echo '7b4395a868b6c8299d6191be04edeea48e4b024d1da22d8cdddeec6f8d851900  '"$base"'/bank_left.png' | sha256sum --check
          echo 'a18c9cf8910805062540a7a3f3ddd07bd360f25564455fe26a29c17bdf362802  '"$base"'/bank_right.png' | sha256sum --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout HEAD^ -- .github/workflows/premium-preview.yml
          git add "$base/bank_left.png" "$base/bank_right.png" .github/workflows/premium-preview.yml
          git rm .github/mission2-payload/bank_left.png.b64.0 .github/mission2-payload/bank_left.png.b64.1 .github/mission2-payload/bank_left.png.b64.2 .github/mission2-payload/bank_right.png.b64.0 .github/mission2-payload/bank_right.png.b64.1 .github/mission2-payload/bank_right.png.b64.2 .github/workflows/restore-mission2-banks.yml
          git commit -m 'fix(premium): restore exact approved Mission 02 bank masters'
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar sintaxe dos módulos Premium
        run: |
          node --check src/render/premium-registry.js
          node --check src/render/premium-environment.js
          node --check src/render/scene2d5.js
          node --check src/game/aircraft.js
      - name: Executar suíte original
        id: regressions
        continue-on-error: true
        run: npm test
      - name: Compilar sem tocar no site original
        run: npm run build
      - name: Conferir núcleo e entradas Premium
        run: |
          test -s dist/index.html
          test -s dist/src/render/premium-registry.js
          test -s dist/src/render/scene2d5.js
          grep -q 'premium-environment' index.html
      - name: Auditar sprites existentes (não bloquear compilação parcial)
        run: |
          node scripts/audit-premium-assets.cjs || echo "::warning::Auditoria Premium: faltas/SHAs inconsistentes, build apenas diagnóstico"
          node scripts/check-premium-environment.cjs || echo "::warning::Texturas de cenário ainda não instaladas no repositório; build de avaliação visual parcial"
      - name: Publicar artefato de teste isolado
        uses: actions/upload-artifact@v4
        with:
          name: riverstorm-premium-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Falhar se houver regressões
        if: steps.regressions.outcome == 'failure'
        run: |
          echo '::error::Suíte original encontrou regressões. Artefato disponível para diagnóstico, mas NÃO homologado.'
          exit 1
