name: Publicar demo jogável (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências
        run: npm install
      - name: Executar testes obrigatórios
        run: npm test
      - name: Validar laboratorio Phaser TypeScript
        run: npm run check:phaser
      - name: Compilar página jogável
        run: npm run build
      - name: Verificar se o HUD novo entrou na build
        shell: bash
        run: |
          test -f dist/phaser-lab.html
          grep -q 'phaser-stage' dist/phaser-lab.html
          grep -Eq 'src="[^"]+\.js"|src="[^"]+\.js\?' dist/phaser-lab.html || { echo '::error::Entrada Phaser nao gerou bundle JS'; exit 1; }
          test -f dist/index.html
          grep -q 'id="compact-hud"' dist/index.html
          grep -q 'HUD 0.7.6' dist/index.html
          grep -q 'id="rs-bottom-actions"' dist/index.html
          grep -q 'id="hangar-preview"' dist/index.html
          grep -q 'id="pilot-portrait"' dist/index.html
          grep -q 'id="pilot-body"' dist/index.html
      - name: Conferir build e recursos com assinatura única
        shell: bash
        run: |
          test -f dist/build-info.json
          grep -q "$GITHUB_SHA" dist/build-info.json
          grep -q "riverstorm-build" dist/index.html
          grep -q "scene2d5.js?build=$GITHUB_SHA" dist/index.html
          grep -q "aircraft.js?build=$GITHUB_SHA" dist/index.html
      - name: Auditar arquivos visuais compilados
        shell: bash
        run: |
          test -f dist/src/render/scene2d5.js
          grep -q 'function waterMotion' dist/src/render/scene2d5.js
          grep -q 'function bankDetails' dist/src/render/scene2d5.js
          grep -q 'drawIslands' dist/src/render/scene2d5.js
          for n in $(seq -w 1 14); do test -f "dist/music/track-$n.opus"; done
          echo 'HUD, cenarios e musicas presentes na build'
      - name: Conferir sprites reais e mecanismos audiovisuais publicados
        shell: bash
        run: |
          assets=(assets/sprites/projectiles/*.svg assets/sprites/bosses/*.svg assets/sprites/terrain/*.svg assets/sprites/enemies/*.svg)
          echo "Inspecionando ${#assets[@]} sprites individuais"
          test "${#assets[@]}" -ge 38 || { echo "::error::Biblioteca de sprites incompleta"; exit 1; }
          for file in "${assets[@]}"; do
            test -s "$file" && test -s "dist/$file" || { echo "::error::Sprite ausente na build: $file"; exit 1; }
            grep -q '<svg' "dist/$file" || { echo "::error::Arquivo nao parece SVG: $file"; exit 1; }
          done
          grep -q 'drawPlayerStatusEffect' dist/index.html
          grep -q 'bossMaxBullets' dist/index.html
          grep -q 'status(kind)' dist/src/audio/sfx-modern.js
          echo "Sprites e efeitos do jogador presentes na build"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar HTML publicado no GitHub Pages
        shell: bash
        run: |
          URL="https://jorgenovojulho.github.io/river-assault-reimagined/?build=${GITHUB_SHA}"
          for attempt in 1 2 3 4 5; do
            if curl -fLsS --max-time 25 "$URL" -o /tmp/riverstorm-public.html; then
              if grep -q 'id="compact-hud"' /tmp/riverstorm-public.html && grep -q 'HUD 0.7.6' /tmp/riverstorm-public.html && grep -q "$GITHUB_SHA" /tmp/riverstorm-public.html && curl -fLsS --max-time 25 "https://jorgenovojulho.github.io/river-assault-reimagined/build-info.json?build=${GITHUB_SHA}" | grep -q "$GITHUB_SHA"; then
                for sprite in assets/sprites/bosses/omega-overlord.svg assets/sprites/enemies/tank.svg assets/sprites/enemies/mecha-gun.svg assets/sprites/terrain/island-tropical.svg assets/sprites/terrain/bridge-damaged.svg assets/sprites/projectiles/plasma-blue.svg; do
                  curl -fLsS --max-time 15 "https://jorgenovojulho.github.io/river-assault-reimagined/$sprite?build=${GITHUB_SHA}" -o /tmp/riverstorm-sprite-check.svg || { echo "::error::Sprite indisponivel em Pages: $sprite"; exit 1; }
                  grep -q '<svg' /tmp/riverstorm-sprite-check.svg || { echo "::error::Sprite invalido no Pages: $sprite"; exit 1; }
                done
                curl -fLsS --max-time 25 "https://jorgenovojulho.github.io/river-assault-reimagined/phaser-lab.html?build=${GITHUB_SHA}" -o /tmp/riverstorm-phaser.html || { echo "::error::Arena Phaser nao publicada"; exit 1; }
                grep -q 'phaser-stage' /tmp/riverstorm-phaser.html || { echo "::error::Pagina Phaser incorreta"; exit 1; }
                echo 'PUBLICACAO VERIFICADA: HUD NOVO DISPONIVEL'
                exit 0
              fi
            fi
            sleep 8
          done
          echo '::error::GitHub Pages nao entregou o HUD 0.7.6. Verificar Settings > Pages > Source = GitHub Actions'
          exit 1
