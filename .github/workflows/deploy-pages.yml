name: Publicar demo jogável (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      - name: Executar testes e registrar falhas
        id: tests
        continue-on-error: true
        run: npm test
      - name: Compilar página jogável
        run: npm run build
      - name: Verificar se o HUD novo entrou na build
        shell: bash
        run: |
          test -f dist/index.html
          grep -q 'id="compact-hud"' dist/index.html
          grep -q 'HUD 0.4.7' dist/index.html
          grep -q 'id="rs-bottom-actions"' dist/index.html
      - name: Auditar arquivos visuais compilados
        shell: bash
        run: |
          test -f dist/src/render/scene2d5.js
          grep -q 'function waterMotion' dist/src/render/scene2d5.js
          grep -q 'function bankDetails' dist/src/render/scene2d5.js
          grep -q 'drawIslands' dist/src/render/scene2d5.js
          for n in $(seq -w 1 14); do test -f "dist/music/track-$n.opus"; done
          echo 'HUD, cenarios e musicas presentes na build'
      - name: Aviso de regressões
        if: steps.tests.outcome == 'failure'
        run: echo "::warning::Há testes reprovados; a versão web foi compilada e publicada para permitir diagnóstico do HUD."
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar HTML publicado no GitHub Pages
        shell: bash
        run: |
          URL="https://jorgenovojulho.github.io/river-assault-reimagined/?build=${GITHUB_SHA}"
          for attempt in 1 2 3 4 5; do
            if curl -fLsS --max-time 25 "$URL" -o /tmp/riverstorm-public.html; then
              if grep -q 'id="compact-hud"' /tmp/riverstorm-public.html && grep -q 'HUD 0.4.7' /tmp/riverstorm-public.html; then
                echo 'PUBLICACAO VERIFICADA: HUD NOVO DISPONIVEL'
                exit 0
              fi
            fi
            sleep 8
          done
          echo '::error::GitHub Pages nao entregou o HUD 0.4.7. Verificar Settings > Pages > Source = GitHub Actions'
          exit 1
