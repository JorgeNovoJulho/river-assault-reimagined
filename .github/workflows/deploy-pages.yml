name: Publicar RiverStorm e Arena Phaser (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias
        id: install
        continue-on-error: true
        run: npm ci --no-audit --no-fund
      - name: Diagnostico da campanha e do motor Phaser
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          npm test
          npm run check:phaser
      - name: Compilar jogo original e arena
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - name: Publicacao de recuperacao caso o build falhe
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html phaser-lab.html dist/
          cp -R src assets dist/
          if [ -d music ]; then cp -R music dist/; fi
          if [ -d public ]; then cp -R public/. dist/; fi
          echo "::warning::Build falhou; publicando fallback estatico. Conferir erros da compilacao."
      - name: Garantir arena e assets no artefato
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          cp phaser-lab.html dist/phaser-lab.html
          test -s dist/phaser-lab.html
          grep -q 'phaser-stage' dist/phaser-lab.html
          test -s dist/assets/sprites/bosses/iron-wasp.svg
          test -s dist/assets/sprites/enemies/mecha-gun.svg
          test -s dist/assets/sprites/projectiles/plasma-blue.svg
          for sprite in assets/sprites/terrain/water-detail.svg assets/sprites/terrain/river-island-detail.svg assets/sprites/terrain/bridge-steel-detail.svg assets/sprites/fx/explosion-ring.svg assets/sprites/player/riverstorm-fighter.svg; do
            test -s "dist/$sprite" || { echo "::error::Sprite novo ausente: $sprite"; exit 1; }
          done
          if [ -d music ]; then
            test -d dist/music || { echo '::error::Trilhas de audio ausentes da publicacao'; exit 1; }
          fi
          touch dist/.nojekyll
          printf '{"build":"%s","published_by":"github-actions","build_outcome":"%s"}\n' "$GITHUB_SHA" "${{ steps.build.outcome }}" > dist/deployment-health.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar arena publicada (404 e revisao)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://jorgenovojulho.github.io/river-assault-reimagined"
          for try in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 20 "$ROOT/phaser-lab.html?sha=$GITHUB_SHA" -o /tmp/arena.html &&
               curl -fsSL --max-time 20 "$ROOT/deployment-health.json?sha=$GITHUB_SHA" -o /tmp/deployment-health.json &&
               grep -q 'phaser-stage' /tmp/arena.html &&
               grep -q "$GITHUB_SHA" /tmp/deployment-health.json; then
              echo "Arena HTML publicada no commit $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo '::error::Arena ainda indisponivel ou Pages servindo revisao antiga. Conferir Settings > Pages > Build and deployment > Source: GitHub Actions.'
          exit 1
