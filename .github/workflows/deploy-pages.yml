name: Publicar demo jogável (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências
        run: npm install
      - name: Executar testes obrigatórios
        run: npm test
      - name: Validar laboratorio Phaser TypeScript (diagnostico)
        continue-on-error: true
        run: npm run check:phaser
      - name: Compilar página jogável
        run: npm run build
      - name: Verificar se o HUD novo entrou na build
        shell: bash
        run: |
          test -f dist/phaser-lab.html
          grep -q 'phaser-stage' dist/phaser-lab.html
          grep -q 'phaser-stage' dist/phaser-lab.html
          grep -Eq 'phaser\.esm\.js|assets/.*\.js' dist/phaser-lab.html || { echo '::error::Arena Phaser sem runtime detectavel'; exit 1; }
          test -f dist/index.html
          grep -q 'id="compact-hud"' dist/index.html
          grep -q 'HUD 0.7.6' dist/index.html
          grep -q 'id="rs-bottom-actions"' dist/index.html
          grep -q 'id="hangar-preview"' dist/index.html
          grep -q 'id="pilot-portrait"' dist/index.html
          grep -q 'id="pilot-body"' dist/index.html
      - name: Conferir build e recursos com assinatura única
        shell: bash
        run: |
          test -f dist/build-info.json
          grep -q "$GITHUB_SHA" dist/build-info.json
          grep -q "riverstorm-build" dist/index.html
          grep -q "scene2d5.js?build=$GITHUB_SHA" dist/index.html
          grep -q "aircraft.js?build=$GITHUB_SHA" dist/index.html
      - name: Auditar arquivos visuais compilados
        shell: bash
        run: |
          test -f dist/src/render/scene2d5.js
          grep -q 'function waterMotion' dist/src/render/scene2d5.js
          grep -q 'function bankDetails' dist/src/render/scene2d5.js
          grep -q 'drawIslands' dist/src/render/scene2d5.js
          for n in $(seq -w 1 14); do test -f "dist/music/track-$n.opus"; done
          echo 'HUD, cenarios e musicas presentes na build'
      - name: Conferir sprites reais e mecanismos audiovisuais publicados
        shell: bash
        run: |
          assets=(assets/sprites/projectiles/*.svg assets/sprites/bosses/*.svg assets/sprites/terrain/*.svg assets/sprites/enemies/*.svg)
          echo "Inspecionando ${#assets[@]} sprites individuais"
          test "${#assets[@]}" -ge 38 || { echo "::error::Biblioteca de sprites incompleta"; exit 1; }
          for file in "${assets[@]}"; do
            test -s "$file" && test -s "dist/$file" || { echo "::error::Sprite ausente na build: $file"; exit 1; }
            grep -q '<svg' "dist/$file" || { echo "::error::Arquivo nao parece SVG: $file"; exit 1; }
          done
          grep -q 'drawPlayerStatusEffect' dist/index.html
          grep -q 'bossMaxBullets' dist/index.html
          grep -q 'status(kind)' dist/src/audio/sfx-modern.js
          echo "Sprites e efeitos do jogador presentes na build"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar jogo e arena Phaser publicados no GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://jorgenovojulho.github.io/river-assault-reimagined"
          # Verifique a arena separadamente: falha no HUD legado nao pode mascarar 404 da arena.
          for path in index.html phaser-lab.html build-info.json; do
            ok=0
            for attempt in 1 2 3 4 5; do
              if curl --fail --location --silent --show-error --max-time 25 \
                "$ROOT/$path?build=$GITHUB_SHA" -o "/tmp/riverstorm-$(basename "$path")"; then
                ok=1
                break
              fi
              sleep 8
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Arquivo nao publicado no GitHub Pages: $path (HTTP 404 ou falha de rede)"
              exit 1
            fi
          done
          grep -q 'phaser-stage' /tmp/riverstorm-phaser-lab.html || { echo '::error::Arena Phaser entregue sem stage'; exit 1; }
          grep -q 'id="compact-hud"' /tmp/riverstorm-index.html || { echo '::error::HUD principal ausente'; exit 1; }
          grep -q "$GITHUB_SHA" /tmp/riverstorm-build-info.json || { echo '::error::Build publicada nao corresponde ao commit'; exit 1; }
          for sprite in assets/sprites/bosses/iron-wasp.svg assets/sprites/enemies/mecha-gun.svg assets/sprites/projectiles/plasma-blue.svg; do
            curl --fail --location --silent --show-error --max-time 20 "$ROOT/$sprite?build=$GITHUB_SHA" -o /tmp/riverstorm-check.svg || { echo "::error::Asset Phaser indisponivel: $sprite"; exit 1; }
            grep -q '<svg' /tmp/riverstorm-check.svg || { echo "::error::Sprite invalido: $sprite"; exit 1; }
          done
          echo "GitHub Pages confirmou arquivos da arena, campanha e sprites no commit $GITHUB_SHA"
