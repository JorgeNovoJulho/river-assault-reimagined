name: Publicar demo jogável (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      - name: Executar testes e registrar falhas
        id: tests
        continue-on-error: true
        run: npm test
      - name: Compilar página jogável
        run: npm run build
      - name: Verificar se o HUD novo entrou na build
        shell: bash
        run: |
          test -f dist/index.html
          grep -q 'id="compact-hud"' dist/index.html
          grep -q 'HUD 0.4.4' dist/index.html
          grep -q 'id="rs-bottom-actions"' dist/index.html
      - name: Aviso de regressões
        if: steps.tests.outcome == 'failure'
        run: echo "::warning::Há testes reprovados; a versão web foi compilada e publicada para permitir diagnóstico do HUD."
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
