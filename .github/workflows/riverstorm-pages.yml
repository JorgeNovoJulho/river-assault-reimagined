name: RiverStorm - validação e publicação web

on:
  push:
    branches: [full-game-graphics-integration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: riverstorm-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes automatizados
        run: npm test
      - name: Compilar o jogo
        run: npm run build
      - name: Verificar arquivos essenciais
        run: |
          test -s dist/index.html
          test -s dist/src/game/campaign.js || test -s dist/assets/index-*.js
      - uses: actions/upload-artifact@v4
        with:
          name: riverstorm-web-test
          path: dist/
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
