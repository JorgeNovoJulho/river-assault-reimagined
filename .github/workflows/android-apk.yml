name: Gerar APK Android de teste
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Buscar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar código
        run: npm test
      - name: Compilar conteúdo do jogo
        run: npm run build
      - name: Criar plataforma Android
        run: npx cap add android
      - name: Sincronizar conteúdo
        run: npx cap sync android
      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew
      - name: Compilar APK Android de teste
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publicar APK para download no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: RiverAssault-Android-APK-Teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
