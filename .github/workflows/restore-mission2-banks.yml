name: Restore Mission 02 bank masters
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact approved bank PNGs
        run: |
          set -euo pipefail
          base='assets/sprites/premium/approved/environment/mission_02_industrial'
          cat .github/mission2-payload/bank_left.png.b64.* | base64 --decode > "$base/bank_left.png"
          cat .github/mission2-payload/bank_right.png.b64.* | base64 --decode > "$base/bank_right.png"
          echo '7b4395a868b6c8299d6191be04edeea48e4b024d1da22d8cdddeec6f8d851900  '"$base"'/bank_left.png' | sha256sum --check
          echo 'a18c9cf8910805062540a7a3f3ddd07bd360f25564455fe26a29c17bdf362802  '"$base"'/bank_right.png' | sha256sum --check
      - name: Commit exact PNG masters and remove temporary payload
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sprites/premium/approved/environment/mission_02_industrial/bank_left.png assets/sprites/premium/approved/environment/mission_02_industrial/bank_right.png
          git rm .github/workflows/restore-mission2-banks.yml .github/mission2-payload/bank_left.png.b64.0 .github/mission2-payload/bank_left.png.b64.1 .github/mission2-payload/bank_left.png.b64.2 .github/mission2-payload/bank_right.png.b64.0 .github/mission2-payload/bank_right.png.b64.1 .github/mission2-payload/bank_right.png.b64.2
          git commit -m 'fix(premium): restore exact approved Mission 02 bank masters'
          git push
