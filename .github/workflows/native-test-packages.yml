name: River Storm - pacotes Windows e Android (teste)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: riverstorm-windows-installer-test
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Gerar APK de teste
        working-directory: android
        run: bash gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: riverstorm-android-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
