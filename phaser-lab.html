<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>RiverStorm — Laboratório Phaser</title><style>
body{margin:0;min-height:100vh;background:#06101f;color:#d8e9f8;font:14px system-ui;display:grid;place-items:center}main{width:min(95vw,920px)}#phaser-stage{width:100%;aspect-ratio:9/16;max-height:78vh;overflow:hidden;border:1px solid #267aa5;border-radius:12px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:1rem 0}a{color:#74e8f8}.notice{color:#f8dca0}</style></head><body><main><header><div><strong>RiverStorm · Phaser + TypeScript</strong><div class="notice">LABORATÓRIO PROVISÓRIO — boss, inimigos e terreno ainda são SVG. Não representa o visual Arcade Premium aprovado.</div></div><a href="./">Voltar ao jogo</a></header><div id="phaser-stage"></div><p id="phaser-status" role="status">Carregando renderizador Phaser...</p>
<p id="riverstorm-version" style="font:12px monospace;color:#80e3ff" aria-live="polite">Versão publicada: __RIVERSTORM_DEPLOY_SHA__</p></main><script>
(function(){
 const status=document.getElementById('phaser-status');
 function fail(message){ if(status){status.textContent='FALHA AO INICIAR: '+message+' — confira o GitHub Actions e atualize a página.';status.style.color='#ff9d8b';} }
 window.addEventListener('error',e=>fail(e.message||'Erro desconhecido'));
 window.addEventListener('unhandledrejection',e=>fail(String(e.reason||'Falha de carregamento')));
})();
</script><script>
(function(){
  const loaded='__RIVERSTORM_DEPLOY_SHA__';
  const label=document.getElementById('riverstorm-version');
  const short=loaded.slice(0,7);
  if(label)label.textContent='Build da arena: '+short+' · atualização automática ativada';
  async function checkLatest(){
    if(document.hidden)return;
    try{
      const response=await fetch('./deployment-health.json?check='+Date.now(),{cache:'no-store'});
      if(!response.ok)return;
      const info=await response.json();
      if(info.build&&info.build!==loaded){
        if(label)label.textContent='Nova versão '+info.build.slice(0,7)+' detectada: atualizando arena...';
        const destination=new URL(location.href);
        destination.searchParams.set('build',info.build.slice(0,12));
        location.replace(destination.href);
      }
    }catch(error){console.warn('Verificação de atualização indisponível',error);}
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkLatest();});
  setInterval(checkLatest,30000);
  checkLatest();
})();
</script><script type="module" src="./src/phaser/main.ts"></script></body></html>
