<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>RiverStorm — Laboratório Phaser</title><style>
body{margin:0;min-height:100vh;background:#06101f;color:#d8e9f8;font:14px system-ui;display:grid;place-items:center}main{width:min(95vw,920px)}#phaser-stage{width:100%;aspect-ratio:9/16;max-height:78vh;overflow:hidden;border:1px solid #267aa5;border-radius:12px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:1rem 0}a{color:#74e8f8}.notice{color:#f8dca0}</style></head><body><main><header><div><strong>RiverStorm · Phaser + TypeScript</strong><div class="notice">Laboratório gráfico isolado — não substitui a campanha original</div></div><a href="./">Voltar ao jogo</a></header><div id="phaser-stage"></div><p id="phaser-status" role="status">Carregando renderizador Phaser...</p></main><script>
(function(){
 const status=document.getElementById('phaser-status');
 function fail(message){ if(status){status.textContent='FALHA AO INICIAR: '+message+' — confira o GitHub Actions e atualize a página.';status.style.color='#ff9d8b';} }
 window.addEventListener('error',e=>fail(e.message||'Erro desconhecido'));
 window.addEventListener('unhandledrejection',e=>fail(String(e.reason||'Falha de carregamento')));
})();
</script><script type="module">
  // Entrada independente: funciona mesmo quando o pipeline TS/Vite ainda não foi publicado.
  // Mantém Phaser 4 como motor e não altera a campanha Original.
  const output=document.getElementById('phaser-status');
  try {
    const engine=await import('https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.esm.js');
    const Phaser=engine.default||engine;
    const W=540,H=960;
    class RecoveryArena extends Phaser.Scene {
      constructor(){super('RecoveryArena');this.enemies=[];this.shots=[];this.hp=3;this.points=0;this.cooldown=0;}
      preload(){
        // SVGs originais usam viewBox sem tamanho físico. Forçar dimensões evita
        // texturas vazias/pretas ao rasterizar no pipeline Phaser 4.
        this.assetFailures=[];
        const sprites=[
          ['boss','bosses/iron-wasp.svg',180,180],
          ['enemy','enemies/mecha-gun.svg',80,92],
          ['bullet','projectiles/plasma-blue.svg',20,46],
          ['fighter','player/riverstorm-fighter.svg',96,112],
          ['bank-left','terrain/river-bank-left.svg',130,480],
          ['bank-right','terrain/river-bank-right.svg',130,480],
          ['water-detail','terrain/water-detail.svg',260,480],
          ['island-detail','terrain/river-island-detail.svg',180,110]
        ];
        for(const [key,file,width,height] of sprites){
          this.load.svg(key,'./assets/sprites/'+file,{width,height});
        }
        // Carregamento visual opcional: a jogabilidade nunca depende destes PNGs.
        // Ativar a skin premium somente se TODOS os recursos necessários existirem.
        this.premiumReady=false;
        this.premiumExplosionReady=false;
        this.premiumManifest={
          fighter:'./assets/sprites/premium/runtime/player/fighter_candidate.png',
          explosion:'./assets/sprites/premium/runtime/fx/explosion_atlas_4x3.png'
        };
        this.load.image('premium-fighter',this.premiumManifest.fighter);
        this.load.spritesheet('premium-explosion',this.premiumManifest.explosion,{frameWidth:128,frameHeight:128});
        this.load.on('loaderror',file=>{
          this.assetFailures.push(file.key);
          console.error('[RiverStorm] Sprite não carregado:',file.key,file.src);
        });
      }
      create(){
        // Fundo aquático contínuo sob todas as margens: elimina faixas pretas
        // causadas pela transparência dos SVGs, sem afetar hitboxes ou lógica.
        this.add.rectangle(W/2,H/2,W,H,0x0c3448).setDepth(-3);
        this.add.rectangle(W/2,H/2,265,H,0x126078).setDepth(-2);
        this.waterTiles=[];
        // Fundo de rio contínuo: mantém aparência uniforme mesmo nas junções
        // das texturas SVG. Objetos não têm colisão e não alteram a jogabilidade.
        this.waterBase=this.add.rectangle(W/2,H/2,280,H,0x145771).setDepth(-2);
        this.waterOverlay=this.add.graphics().setDepth(-1);
        this.waterPhase=0;
        this.waterDetailRows=22;
        // Tiles antigos mantidos em preload para rollback; não desenhados, pois suas emendas eram visíveis.
        this.islandVisuals=[this.add.image(157,-90,'island-detail').setDisplaySize(102,63).setDepth(0),this.add.image(378,-560,'island-detail').setDisplaySize(110,66).setDepth(0)];
        this.banks=[];
        for(let j=0;j<3;j++){
          this.banks.push(this.add.image(65,j*480-240,'bank-left').setDisplaySize(130,480).setDepth(0));
          this.banks.push(this.add.image(W-65,j*480-240,'bank-right').setDisplaySize(130,480).setDepth(0));
        }
        this.boss=this.add.image(W/2,170,'boss').setDisplaySize(170,130);
        this.premiumReady=this.textures.exists('premium-fighter');
        this.premiumExplosionReady=this.textures.exists('premium-explosion');
        this.player=this.add.image(W/2,H-120,this.premiumReady?'premium-fighter':'fighter').setDisplaySize(52,61).setDepth(2);
        if(this.premiumExplosionReady){
          this.anims.create({key:'premium-boom',frames:this.anims.generateFrameNumbers('premium-explosion',{start:0,end:11}),frameRate:20,repeat:0});
        }
        this.keys=this.input.keyboard.createCursorKeys();
        this.keyboardSpace=this.input.keyboard.addKey('SPACE');
        this.status=this.add.text(10,10,'PHASER 4 | RECUPERAÇÃO',{fontFamily:'monospace',fontSize:'17px',color:'#ffffff'});
        this.add.text(10,42,'Setas: mover | Espaço: atirar | toque: mover e atirar',{fontFamily:'monospace',fontSize:'12px',color:'#d6efff'});
        this.input.on('pointerdown',p=>{this.pressed=true;this.target={x:p.x,y:p.y};});
        this.input.on('pointermove',p=>{if(this.pressed)this.target={x:p.x,y:p.y};});
        this.input.on('pointerup',()=>{this.pressed=false;});
        const missing=['boss','enemy','bullet','fighter','bank-left','bank-right','water-detail','island-detail'].filter(key=>!this.textures.exists(key));
        // A ausência dos PNGs premium é esperada enquanto não forem publicados;
        // não classificar essa ausência como falha dos SVGs ativos.
        const mandatoryFailures=this.assetFailures.filter(k=>!k.startsWith('premium-'));
        if(mandatoryFailures.length||missing.length){
          output.textContent='ATENÇÃO: texturas com falha: '+[...new Set([...mandatoryFailures,...missing])].join(', ')+'. Verifique recursos no GitHub Pages.';
          output.style.color='#ffb384';
        }else{
          output.textContent='Arena Phaser: 8/8 sprites legados OK; skin '+(this.premiumReady?'NAVE PREMIUM ativa':'SVG legado (nave premium não publicada)')+'; explosão '+(this.premiumExplosionReady?'premium ativa':'premium ausente')+'. Campanha preservada.';
        }
      }
      playVisualExplosion(x,y){
        if(!this.premiumExplosionReady)return;
        const effect=this.add.sprite(x,y,'premium-explosion',0)
          .setDisplaySize(76,76).setDepth(8)
          .setBlendMode(Phaser.BlendModes.SCREEN);
        effect.once('animationcomplete',()=>effect.destroy());
        effect.play('premium-boom');
      }
      update(time,delta){
        const dt=Math.min(2,delta/16.7);
        // Detalhe aquático animado de baixo custo: somente renderização.
        // O padrão não altera projéteis, inimigos, velocidade ou hitboxes.
        this.waterPhase=(this.waterPhase+delta*.035)%44;
        this.waterOverlay.clear();
        this.waterOverlay.lineStyle(1,0xa2edf0,.19);
        for(let k=0;k<this.waterDetailRows;k++){
          const y=(k*44+this.waterPhase)%H;
          const x=158+(k*73)%215;
          this.waterOverlay.beginPath();
          this.waterOverlay.moveTo(x,y);
          this.waterOverlay.lineTo(x+15,y-3);
          this.waterOverlay.lineTo(x+31,y);
          this.waterOverlay.strokePath();
        }
        for(const bank of this.banks){bank.y+=1.25*dt;if(bank.y>H+240)bank.y-=1440;}
        for(const tile of this.waterTiles){tile.y+=1.25*dt;if(tile.y>H+240)tile.y-=1440;}
        for(const island of this.islandVisuals){island.y+=1.25*dt;if(island.y>H+75)island.y-=1250;}
        if(this.keys.left.isDown)this.player.x-=5*dt;
        if(this.keys.right.isDown)this.player.x+=5*dt;
        if(this.keys.up.isDown)this.player.y-=5*dt;
        if(this.keys.down.isDown)this.player.y+=5*dt;
        if(this.pressed&&this.target){this.player.x+=(this.target.x-this.player.x)*.25;this.player.y+=(this.target.y-this.player.y)*.25;}
        this.player.x=Phaser.Math.Clamp(this.player.x,24,W-24);
        this.player.y=Phaser.Math.Clamp(this.player.y,85,H-25);
        if((this.keyboardSpace.isDown||this.pressed)&&time>this.cooldown){
          this.shots.push(this.add.image(this.player.x,this.player.y-25,'bullet').setDisplaySize(9,25));
          this.cooldown=time+140;
        }
        if(this.enemies.length<5&&Math.random()<.012*dt)this.enemies.push(this.add.image(40+Math.random()*(W-80),-35,'enemy').setDisplaySize(58,70));
        for(let i=this.enemies.length-1;i>=0;i--){
          const e=this.enemies[i];e.y+=2.4*dt;
          if(e.y>H+40){e.destroy();this.enemies.splice(i,1);continue;}
          if(Math.abs(e.x-this.player.x)<30&&Math.abs(e.y-this.player.y)<32){e.destroy();this.enemies.splice(i,1);this.hp--;if(this.hp<=0){this.hp=3;this.points=0;}}
        }
        for(let i=this.shots.length-1;i>=0;i--){
          const b=this.shots[i];b.y-=12*dt;
          if(b.y<0){b.destroy();this.shots.splice(i,1);continue;}
          for(let j=this.enemies.length-1;j>=0;j--){const e=this.enemies[j];if(Math.abs(e.x-b.x)<25&&Math.abs(e.y-b.y)<30){this.playVisualExplosion(e.x,e.y);e.destroy();b.destroy();this.enemies.splice(j,1);this.shots.splice(i,1);this.points+=100;break;}}
        }
        this.status.setText('PHASER 4 | '+Math.round(this.game.loop.actualFps)+' FPS | VIDAS '+this.hp+' | PONTOS '+this.points);
      }
    }
    new Phaser.Game({type:Phaser.AUTO,parent:'phaser-stage',width:W,height:H,scene:[RecoveryArena],scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH}});
  }catch(error){output.textContent='Falha ao iniciar Phaser: '+String(error);output.style.color='#ff9d8b';console.error(error);}
</script></body></html>
