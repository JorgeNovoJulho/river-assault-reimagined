<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverStorm · Boss 01 — Teste direto</title><style>body{margin:0;background:#07101d;color:#e6f5ff;font:14px system-ui;text-align:center}header{padding:12px}a{color:#6be7ff}#game{touch-action:none;user-select:none;width:min(100vw,540px);margin:auto;aspect-ratio:9/14;border:1px solid #3e91b2;border-radius:12px;overflow:hidden}.tag{color:#ffd88d}button{margin:5px;padding:9px 14px;border:1px solid #72d7ef;background:#133450;color:white;border-radius:7px;cursor:pointer}</style></head><body><header><strong>RIVERSTORM — BOSS 01 · PONTE FORTIFICADA</strong><div class="tag">ARTE PROVISÓRIA PARA TESTAR CONTROLES • NÃO REPRESENTA A QUALIDADE FINAL DO JOGO</div><div><a href="./phaser-lab.html">Arena Phaser</a> | <a href="./">Campanha</a></div></header><div id="game"></div><p id="status">Carregando teste...</p><div><button id="pause">Pausar/Continuar</button><button id="damage">Alternar dano visual</button><button id="reset">Reiniciar</button></div><p>WASD / setas: mover • Espaço: disparar • Mouse: mover • Clique segurado: disparar • Toque: mover e disparar</p><script type="module">import Phaser from "phaser";
(function(){const st=document.getElementById('status');if(!Phaser){st.textContent='Não foi possível iniciar Phaser';return}let sceneRef=null,damage=false,paused=false;class Test extends Phaser.Scene{constructor(){super('test')}preload(){this.load.image('plane','./assets/sprites/premium/runtime/player/fighter_candidate.png');this.load.svg('bridge','./assets/sprites/terrain/bridge-steel-detail.svg',{width:720,height:260});this.load.svg('water','./assets/sprites/terrain/water-detail.svg',{width:540,height:102});this.load.on('loaderror',f=>{st.textContent='Recurso indisponível: '+f.key})}create(){sceneRef=this;const W=540,H=840;this.cameras.main.setBackgroundColor('#0d3149');for(let i=0;i<10;i++){let t=this.add.image(270,i*100-50,'water').setDisplaySize(540,102);t.setAlpha(.9)}this.boss=this.add.image(270,190,'bridge').setDisplaySize(470,160);this.boss.setDepth(1);this.towers=[];for(const [x,y] of [[130,154],[410,154],[211,222],[329,222]]){let mount=this.add.container(x,y).setDepth(2);let base=this.add.circle(0,0,18,0x344a5c).setStrokeStyle(3,0x9ab4c3);let barrel=this.add.rectangle(0,15,10,36,0x6e879a).setStrokeStyle(1,0xc8e2f4);mount.add([base,barrel]);this.towers.push(mount)}this.ship=this.add.image(270,710,'plane').setDisplaySize(64,72).setDepth(5);this.bullets=this.add.group();this.keys=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT,SPACE');this.pointerTarget=null;this.pointerFiring=false;const aim=p=>{this.pointerTarget={x:Phaser.Math.Clamp(p.x,34,506),y:Phaser.Math.Clamp(p.y,330,795)};};this.input.on('pointermove',p=>{if(p.pointerType==='mouse'||p.isDown)aim(p)});this.input.on('pointerdown',p=>{aim(p);this.pointerFiring=true});this.input.on('pointerup',()=>{this.pointerFiring=false});this.input.on('gameout',()=>{this.pointerFiring=false;this.pointerTarget=null});window.addEventListener('blur',()=>{this.pointerFiring=false;this.pointerTarget=null});this.lastShot=0;this.add.text(12,12,'TESTE DE CONTROLES • ARTE PROVISÓRIA',{fontSize:'16px',color:'#fff'}).setDepth(10);st.textContent='Teste carregado — mouse e toque habilitados; ponte técnica ainda não aprovada';}update(t,dt){if(paused)return;let speed=dt*.35;let x=(this.keys.D.isDown||this.keys.RIGHT.isDown?1:0)-(this.keys.A.isDown||this.keys.LEFT.isDown?1:0);let y=(this.keys.S.isDown||this.keys.DOWN.isDown?1:0)-(this.keys.W.isDown||this.keys.UP.isDown?1:0);if(x||y){this.pointerTarget=null;this.ship.x=Phaser.Math.Clamp(this.ship.x+x*speed,32,508);this.ship.y=Phaser.Math.Clamp(this.ship.y+y*speed,350,800)}else if(this.pointerTarget){let d=Math.hypot(this.pointerTarget.x-this.ship.x,this.pointerTarget.y-this.ship.y);if(d>1){let step=Math.min(d,speed*1.55);this.ship.x+=((this.pointerTarget.x-this.ship.x)/d)*step;this.ship.y+=((this.pointerTarget.y-this.ship.y)/d)*step;}}for(let i=0;i<this.towers.length;i++){let tower=this.towers[i];tower.rotation=Math.atan2(this.ship.y-tower.y,this.ship.x-tower.x)-Math.PI/2; tower.setAlpha(damage&&i%2===0?.45:1)}if((this.keys.SPACE.isDown||this.pointerFiring)&&t-this.lastShot>160){this.lastShot=t;const bullet=this.add.rectangle(this.ship.x,this.ship.y-40,5,20,0x50ecff).setDepth(4);this.bullets.add(bullet)}this.bullets.getChildren().forEach(b=>{b.y-=dt*.9;if(b.y<20)b.destroy()});this.boss.setTint(damage?0xcc7777:0xffffff)}}new Phaser.Game({type:Phaser.AUTO,parent:'game',width:540,height:840,backgroundColor:'#0a2435',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Test]});document.getElementById('pause').onclick=()=>{paused=!paused;st.textContent=paused?'Pausado':'Teste em andamento'};document.getElementById('damage').onclick=()=>{damage=!damage};document.getElementById('reset').onclick=()=>location.reload()})()
</script></body></html>
