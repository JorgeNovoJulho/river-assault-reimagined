<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverStorm · Boss 01 — Teste direto</title><style>body{margin:0;background:#07101d;color:#e6f5ff;font:14px system-ui;text-align:center}header{padding:12px}a{color:#6be7ff}#game{touch-action:none;user-select:none;width:min(100vw,540px);margin:auto;aspect-ratio:9/14;border:1px solid #3e91b2;border-radius:12px;overflow:hidden}.tag{color:#ffd88d}button{margin:5px;padding:9px 14px;border:1px solid #72d7ef;background:#133450;color:white;border-radius:7px;cursor:pointer}</style></head><body><header><strong>RIVERSTORM — BOSS 01 · PONTE FORTIFICADA</strong><div class="tag">AMBIENTE EXPERIMENTAL · ARTE DO BOSS 01 AINDA NÃO HOMOLOGADA</div><div><a href="./phaser-lab.html">Arena Phaser</a> | <a href="./">Campanha</a></div></header><div id="game"></div><p id="status">Carregando teste...</p><div><button id="pause">Pausar/Continuar</button><button id="damage">Alternar dano visual</button><button id="reset">Reiniciar</button></div><p>WASD / setas: mover • Espaço: disparar • Mouse: mover • Clique segurado: disparar • Toque: mover e disparar</p><script type="module">import Phaser from "phaser";
(function(){const st=document.getElementById('status');if(!Phaser){st.textContent='Não foi possível iniciar Phaser';return}let sceneRef=null,damage=false,paused=false;class Test extends Phaser.Scene{constructor(){super('test')}preload(){this.load.image('plane','./assets/sprites/premium/runtime/player/fighter_candidate.png');this.load.svg('bridge','./assets/sprites/terrain/bridge-steel-detail.svg',{width:720,height:260});this.load.svg('water','./assets/sprites/terrain/water-detail.svg',{width:540,height:102});this.load.on('loaderror',f=>{st.textContent='Recurso indisponível: '+f.key})}create(){sceneRef=this;const W=540,H=840;this.cameras.main.setBackgroundColor('#0d3149');// Rio ocupa toda a largura útil: a textura SVG antiga tem transparência e não deve formar uma faixa estreita.
const river=this.add.graphics().setDepth(-2);
river.fillGradientStyle(0x082c45,0x082c45,0x195e70,0x195e70,1);
river.fillRect(0,0,540,840);
const shores=this.add.graphics().setDepth(-1);
for(const [left,right] of [[0,75],[465,540]]){
 shores.fillGradientStyle(0x263e31,0x385744,0x223b36,0x344d40,1);shores.fillRect(left,0,right-left,840);
 for(let k=0;k<36;k++){const yy=k*29+(k%3)*8;const xx=left+(right-left)*(0.15+((k*37)%71)/100);shores.fillStyle(k%4===0?0x668665:0x234f3d,k%4===0?0.42:0.65);shores.fillEllipse(xx,yy,24+(k%3)*9,12+(k%4)*4)}
}
shores.lineStyle(5,0x769b86,.55);shores.lineBetween(75,0,75,840);shores.lineBetween(465,0,465,840);
this.waves=this.add.graphics().setDepth(0);
this.boss=this.add.image(270,190,'bridge').setDisplaySize(470,160);this.boss.setDepth(1);const deck=this.add.graphics().setDepth(1.4);deck.fillStyle(0x101c2c,.38);deck.fillRoundedRect(42,141,456,102,7);deck.lineStyle(3,0x9fbecb,.65);deck.strokeRoundedRect(42,141,456,102,7);for(let k=0;k<24;k++){const px=56+k*19;deck.fillStyle(k%3===0?0xf8d28a:0x899dab,k%3===0?.65:.42);deck.fillRect(px,148,8,3);deck.fillRect(px,232,8,3)}const plates=this.add.graphics().setDepth(1.5);for(const [px,py] of [[93,157],[448,157],[185,201],[356,201]]){plates.fillStyle(0x233747,.95);plates.fillCircle(px,py,24);plates.lineStyle(3,0x89acbc,.9);plates.strokeCircle(px,py,24);plates.fillStyle(0xb2c9cd,.55);for(let a=0;a<6;a++){const q=a*Math.PI/3;plates.fillCircle(px+19*Math.cos(q),py+19*Math.sin(q),2)}}this.towers=[];for(const [x,y] of [[130,154],[410,154],[211,222],[329,222]]){let mount=this.add.container(x,y).setDepth(2);let base=this.add.circle(0,0,18,0x344a5c).setStrokeStyle(3,0x9ab4c3);let barrel=this.add.rectangle(0,15,10,36,0x6e879a).setStrokeStyle(1,0xc8e2f4);mount.add([base,barrel]);this.towers.push(mount)}this.ship=this.add.image(270,710,'plane').setDisplaySize(64,72).setDepth(5);this.bullets=this.add.group();this.keys=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT,SPACE');this.pointerTarget=null;this.pointerFiring=false;const aim=p=>{this.pointerTarget={x:Phaser.Math.Clamp(p.x,34,506),y:Phaser.Math.Clamp(p.y,330,795)};};this.input.on('pointermove',p=>{if(p.pointerType==='mouse'||p.isDown)aim(p)});this.input.on('pointerdown',p=>{aim(p);this.pointerFiring=true});this.input.on('pointerup',()=>{this.pointerFiring=false});this.input.on('gameout',()=>{this.pointerFiring=false;this.pointerTarget=null});window.addEventListener('blur',()=>{this.pointerFiring=false;this.pointerTarget=null});this.lastShot=0;this.add.text(12,12,'LAB PREMIUM · AMBIENTE PROVISÓRIO',{fontSize:'16px',color:'#fff'}).setDepth(10);st.textContent='Teste carregado — mouse e toque habilitados; ponte técnica ainda não aprovada';}update(t,dt){if(paused)return;this.waves.clear();this.waves.lineStyle(1.4,0x7dc1c7,.17);for(let i=0;i<22;i++){const wy=((i*43+t*.028)%930)-45;const wx=95+((i*67)%325);this.waves.lineBetween(wx,wy,wx+13+i%9,wy-3);}let speed=dt*.35;let x=(this.keys.D.isDown||this.keys.RIGHT.isDown?1:0)-(this.keys.A.isDown||this.keys.LEFT.isDown?1:0);let y=(this.keys.S.isDown||this.keys.DOWN.isDown?1:0)-(this.keys.W.isDown||this.keys.UP.isDown?1:0);if(x||y){this.pointerTarget=null;this.ship.x=Phaser.Math.Clamp(this.ship.x+x*speed,32,508);this.ship.y=Phaser.Math.Clamp(this.ship.y+y*speed,350,800)}else if(this.pointerTarget){let d=Math.hypot(this.pointerTarget.x-this.ship.x,this.pointerTarget.y-this.ship.y);if(d>1){let step=Math.min(d,speed*1.55);this.ship.x+=((this.pointerTarget.x-this.ship.x)/d)*step;this.ship.y+=((this.pointerTarget.y-this.ship.y)/d)*step;}}for(let i=0;i<this.towers.length;i++){let tower=this.towers[i];tower.rotation=Math.atan2(this.ship.y-tower.y,this.ship.x-tower.x)-Math.PI/2; tower.setAlpha(damage&&i%2===0?.45:1)}if((this.keys.SPACE.isDown||this.pointerFiring)&&t-this.lastShot>160){this.lastShot=t;const bullet=this.add.rectangle(this.ship.x,this.ship.y-40,5,20,0x50ecff).setDepth(4);this.bullets.add(bullet)}this.bullets.getChildren().forEach(b=>{b.y-=dt*.9;if(b.y<20)b.destroy()});this.boss.setTint(damage?0xcc7777:0xffffff)}}new Phaser.Game({type:Phaser.AUTO,parent:'game',width:540,height:840,backgroundColor:'#0a2435',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Test]});document.getElementById('pause').onclick=()=>{paused=!paused;st.textContent=paused?'Pausado':'Teste em andamento'};document.getElementById('damage').onclick=()=>{damage=!damage};document.getElementById('reset').onclick=()=>location.reload()})()
</script></body></html>
